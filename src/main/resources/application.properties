# ============================================
# PayShield Platform - Application Configuration
# ============================================

spring.application.name=payshield-platform

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/payshield
spring.datasource.username=${DB_USERNAME:payshield}
spring.datasource.password=${DB_PASSWORD:payshield}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payshield-analytics

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.paymentProcessing.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentProcessing.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentProcessing.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentProcessing.permitted-number-of-calls-in-half-open-state=3

# Logging
logging.level.com.payshield=INFO
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
